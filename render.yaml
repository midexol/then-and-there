# Render blueprint for the API. The Qloo harness needs a long-running Node 22.19+ process (not serverless).
services:
  - type: web
    name: then-and-there-api
    runtime: node
    rootDir: server
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.19.0
      - key: QLOO_API_KEY
        sync: false
      # Hackathon keys only work on this host; both must be set to the same URL.
      - key: QLOO_BASE_URL
        value: https://hackathon.api.qloo.com
      - key: QLOO_TRUSTED_BASE_URL
        value: https://hackathon.api.qloo.com
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: ALLOWED_ORIGIN
        sync: false
